<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101322"><link rel="manifest" href="/manifest.webmanifest"><title>Sohel Studio</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#f4f5ff;font-family:system-ui,sans-serif}main{max-width:760px;margin:auto;padding:22px}.panel{background:#171d32;border:1px solid #303954;border-radius:18px;padding:18px;margin:16px 0}h1{color:#b9a5ff}p{color:#c2c8dc;line-height:1.6}label{display:block;margin:14px 0 6px}input,select,textarea,button{width:100%;padding:13px;border-radius:10px;border:1px solid #414b69;background:#0e1427;color:white;font:inherit}button{background:#7557e8;border:0;font-weight:700;margin-top:14px}button:disabled{opacity:.6}small{color:#aeb6cc}.preview{max-width:100%;max-height:260px;display:none;margin-top:12px;border-radius:12px}#status{padding:12px;border-radius:10px;background:#10182d}</style></head><body><main><h1>Sohel Studio</h1><p>আপনার AI ভিডিও তৈরির স্টুডিও</p><div class="panel"><h2>নতুন ভিডিও প্রজেক্ট</h2><label>ভিডিও তৈরির ধরন</label><select id="mode"><option>Text to Video</option><option>Image to Video</option></select><label>আপনার ভিডিওর বর্ণনা</label><textarea id="prompt" rows="4" placeholder="আপনি কী ধরনের ভিডিও চান লিখুন..."></textarea><label>মডেল</label><select id="model"><option>LTX-Video</option><option>Wan 2.1</option><option>Kling</option></select><label>ভিডিওর দৈর্ঘ্য</label><select id="duration"><option value="5">৫ সেকেন্ড</option><option value="10">১০ সেকেন্ড</option></select><label>রেফারেন্স ছবি (ঐচ্ছিক)</label><input id="image" type="file" accept="image/*"><img id="preview" class="preview" alt="ছবির প্রিভিউ"><button id="generate">ভিডিও তৈরির অনুরোধ</button><p id="status" role="status">সার্ভার সংযোগের প্রস্তুতি সম্পন্ন। AI মডেল এখনো যুক্ত করা হয়নি।</p><p>নিরাপত্তা: API key কখনো এই পেজে লিখবেন না বা কারও সঙ্গে শেয়ার করবেন না।</p></div><div class="panel"><h3>প্রজেক্ট ইতিহাস</h3><div id="history">এখনো কোনো প্রজেক্ট নেই।</div></div><small>Sohel Studio V3 • Server-ready PWA</small></main><script>if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js');const file=document.querySelector('#image'),preview=document.querySelector('#preview');file.onchange=()=>{if(file.files[0]){preview.src=URL.createObjectURL(file.files[0]);preview.style.display='block'}};const hist=document.querySelector('#history');function render(){const a=JSON.parse(localStorage.getItem('sohelProjects')||'[]');hist.textContent=a.length?a.join(' • '):'এখনো কোনো প্রজেক্ট নেই।'}render();document.querySelector('#generate').onclick=async()=>{const prompt=document.querySelector('#prompt').value.trim(),status=document.querySelector('#status'),btn=document.querySelector('#generate');if(!prompt){status.textContent='আগে ভিডিওর বর্ণনা লিখুন।';return}const data={prompt,mode:document.querySelector('#mode').value,model:document.querySelector('#model').value,duration:Number(document.querySelector('#duration').value)};const a=JSON.parse(localStorage.getItem('sohelProjects')||'[]');a.unshift(prompt);localStorage.setItem('sohelProjects',JSON.stringify(a.slice(0,10)));render();btn.disabled=true;status.textContent='সার্ভারের সঙ্গে যোগাযোগ করা হচ্ছে...';try{const r=await fetch('/.netlify/functions/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const j=await r.json();status.textContent=j.message||j.error||'সার্ভার উত্তর দিয়েছে।'}catch(e){status.textContent='সার্ভারে পৌঁছানো যায়নি। Netlify Functions-সহ Git deploy প্রয়োজন।'}finally{btn.disabled=false}};</script></body></html>
